name: "verify-trust"
description: "Verify that every commit in a range is signed by a DID your community's Trust Registry currently authorizes."

# The signer set is derived from the commits: each names its signer DID on its
# committer header, that DID must publish the key that signed, and the registry
# must authorize it. There is no per-repository signer list — `resource` below
# is what scopes a signer to this repository.

inputs:
  range:
    description: "Commit range in git rev-list syntax (e.g. origin/main..HEAD). Requires the base ref to be fetched (actions/checkout with fetch-depth: 0)."
    required: true
  registry-did:
    description: "DID of the Trust Registry — the recipient of every query, and what the endpoint is discovered from."
    required: true
  vtc-did:
    description: "DID of your VTC: the community whose authority the trust tuple is evaluated under (TRQP's authority_id)."
    required: true
  registry-url:
    description: "Base URL of the Trust Registry. Optional — by default the endpoint is discovered from registry-did's DID document, preferring TSP, then DIDComm, then HTTPS. Set this only to override discovery (e.g. a local registry publishing no service entry); it unbinds where we ask from the DID we name."
    required: false
    default: ""
  action:
    description: "TRQP action of the trust tuple."
    required: false
    default: "git.commit.sign"
  resource:
    description: "TRQP resource of the trust tuple. Defaults to this repository (owner/name). SECURITY-RELEVANT: with no committed signer list, this is the only thing scoping a signer to this repository — widening it widens who may sign."
    required: false
    default: ${{ github.repository }}
  fallback-resource:
    description: "Broader resource to also accept a grant under (e.g. the org). Grant semantics are OR. Omitted: only the primary resource is queried. Widens who may sign, exactly like `resource`."
    required: false
    default: ""
  max-signers:
    description: "Ceiling on the number of distinct signer DIDs a range may claim. Each costs one DID resolution, to a host the commit's author chose, so this bounds what a pull request can make the runner resolve."
    required: false
    default: "32"
  exempt-keyring:
    description: "Armored PGP keyring of exempt platform keys (e.g. GitHub's web-flow key). PGP-signed commits pass only if they verify against a key in this file. Omitted: no exemptions."
    required: false
    default: ""
  resolve-agent-names:
    description: "Verify the agent names signers' DID documents claim, by resolving each name back to the DID claiming it. Without this a claimed name still shows, tagged [unverified] — alsoKnownAs is self-asserted. Costs one outbound HTTPS fetch per claimed name."
    required: false
    default: "false"
  json:
    description: "Emit a machine-readable JSON report on stdout."
    required: false
    default: "false"
  version:
    description: "VGI release to download the verify-trust binary from — a tag like v0.1.0, or 'latest'."
    required: false
    default: "latest"

runs:
  using: "composite"
  steps:
    - name: Install verify-trust
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        VGI_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          Linux-X64)   target=x86_64-unknown-linux-gnu ;;
          macOS-ARM64) target=aarch64-apple-darwin ;;
          macOS-X64)   target=x86_64-apple-darwin ;;
          Windows-X64) target=x86_64-pc-windows-msvc ;;
          *) echo "::error::verify-trust: unsupported runner ${RUNNER_OS}-${RUNNER_ARCH}"; exit 1 ;;
        esac
        repo="OpenVTC/verifiable-git-infrastructure"
        asset="verify-trust-${target}.tar.gz"
        tag="$VGI_VERSION"
        if [ "$tag" = "latest" ]; then
          tag="$(gh release view --repo "$repo" --json tagName -q .tagName)"
        fi
        echo "Downloading ${asset} from ${repo}@${tag}"
        gh release download "$tag" --repo "$repo" \
          --pattern "$asset" --pattern "${asset}.sha256" --dir "$RUNNER_TEMP"
        (
          cd "$RUNNER_TEMP"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum -c "${asset}.sha256"
          else
            shasum -a 256 -c "${asset}.sha256"
          fi
          tar xzf "$asset"
        )
        echo "${RUNNER_TEMP}/verify-trust-${target}" >> "$GITHUB_PATH"

    - name: Run verify-trust
      shell: bash
      # Every input reaches the script through the environment, never through
      # `${{ }}` in the script body: an expression there is pasted into the
      # script as text before bash parses it. Referenced as quoted variables,
      # the values stay data, whatever they contain.
      env:
        VT_RANGE: ${{ inputs.range }}
        VT_REGISTRY_DID: ${{ inputs.registry-did }}
        VT_VTC_DID: ${{ inputs.vtc-did }}
        VT_ACTION: ${{ inputs.action }}
        VT_RESOURCE: ${{ inputs.resource }}
        VT_MAX_SIGNERS: ${{ inputs.max-signers }}
        VT_REGISTRY_URL: ${{ inputs.registry-url }}
        VT_FALLBACK_RESOURCE: ${{ inputs.fallback-resource }}
        VT_EXEMPT_KEYRING: ${{ inputs.exempt-keyring }}
        VT_RESOLVE_AGENT_NAMES: ${{ inputs.resolve-agent-names }}
        VT_JSON: ${{ inputs.json }}
      run: |
        set -euo pipefail
        case "$VT_MAX_SIGNERS" in
          ''|*[!0-9]*) echo "::error::verify-trust: max-signers must be a non-negative integer"; exit 1 ;;
        esac
        case "$VT_RANGE" in
          -*) echo "::error::verify-trust: range must be a revision range, not an option"; exit 1 ;;
        esac
        args=(
          --range "$VT_RANGE"
          --registry-did "$VT_REGISTRY_DID"
          --vtc-did "$VT_VTC_DID"
          --action "$VT_ACTION"
          --resource "$VT_RESOURCE"
          --max-signers "$VT_MAX_SIGNERS"
        )
        if [ -n "$VT_REGISTRY_URL" ]; then
          args+=(--registry-url "$VT_REGISTRY_URL")
        fi
        if [ -n "$VT_FALLBACK_RESOURCE" ]; then
          args+=(--fallback-resource "$VT_FALLBACK_RESOURCE")
        fi
        if [ -n "$VT_EXEMPT_KEYRING" ]; then
          args+=(--exempt-keyring "$VT_EXEMPT_KEYRING")
        fi
        if [ "$VT_RESOLVE_AGENT_NAMES" = "true" ]; then
          args+=(--resolve-agent-names)
        fi
        if [ "$VT_JSON" = "true" ]; then
          args+=(--json)
        fi
        verify-trust "${args[@]}"
