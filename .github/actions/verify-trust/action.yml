name: "verify-trust"
description: "Verify that every commit in a range is signed by a DID your community's Trust Registry currently authorizes."

# The signer set is derived from the commits: each names its signer DID on its
# committer header, that DID must publish the key that signed, and the registry
# must authorize it. There is no per-repository signer list — `resource` below
# is what scopes a signer to this repository.

inputs:
  range:
    description: "Commit range in git rev-list syntax (e.g. origin/main..HEAD). Requires the base ref to be fetched (actions/checkout with fetch-depth: 0)."
    required: true
  registry-did:
    description: "DID of the Trust Registry — the recipient of every query, and what the endpoint is discovered from."
    required: true
  vtc-did:
    description: "DID of your VTC: the community whose authority the trust tuple is evaluated under (TRQP's authority_id)."
    required: true
  registry-url:
    description: "Base URL of the Trust Registry. Optional — by default the endpoint is discovered from registry-did's DID document, preferring TSP, then DIDComm, then HTTPS. Set this only to override discovery (e.g. a local registry publishing no service entry); it unbinds where we ask from the DID we name."
    required: false
    default: ""
  action:
    description: "TRQP action of the trust tuple."
    required: false
    default: "git.commit.sign"
  resource:
    description: "TRQP resource of the trust tuple. Defaults to this repository: owner/name under resource-format legacy, or <forge-host>/owner/name (e.g. github.com/acme/widgets) under qualified. SECURITY-RELEVANT: with no committed signer list, this is the only thing scoping a signer to this repository — widening it widens who may sign."
    required: false
    default: ""
  fallback-resource:
    description: "Broader resource to also accept a grant under (e.g. the org: acme under legacy, github.com/acme under qualified). Grant semantics are OR. Omitted: only the primary resource is queried. Widens who may sign, exactly like `resource`."
    required: false
    default: ""
  resource-format:
    description: "Form of resource and fallback-resource: 'legacy' (owner/name, as before) or 'qualified' (<forge-host>/owner/name, lowercased). Registry grants must use the same form. The default flips to 'qualified' in a later release, and 'legacy' is then removed."
    required: false
    default: "legacy"
  max-signers:
    description: "Ceiling on the number of distinct signer DIDs a range may claim. Each costs one DID resolution, to a host the commit's author chose, so this bounds what a pull request can make the runner resolve."
    required: false
    default: "32"
  exempt-keyring:
    description: "Armored PGP keyring of exempt platform keys (e.g. GitHub's web-flow key). Only a PGP-signed merge commit can pass on it: its signature must verify against a key in this file, its parents must pass, and its tree must be their clean merge. Single-parent platform commits (web-UI edits, squash merges, Dependabot) fail platformSignedEdit. Omitted: no exemptions."
    required: false
    default: ""
  resolve-agent-names:
    description: "Verify the agent names signers' DID documents claim, by resolving each name back to the DID claiming it. Without this a claimed name still shows, tagged [unverified] — alsoKnownAs is self-asserted. Costs one outbound HTTPS fetch per claimed name."
    required: false
    default: "false"
  json:
    description: "Emit a machine-readable JSON report on stdout."
    required: false
    default: "false"
  version:
    description: "VGI release to download the verify-trust binary from — a tag like v0.1.0, or 'latest'."
    required: false
    default: "latest"
  verify-attestation:
    description: "Verify the downloaded tarball's build-provenance attestation (signed by this repository's release workflow, for the release tag). 'auto' verifies when the gh CLI is installed and the runner is on github.com; elsewhere (e.g. Forgejo runners) only the SHA-256 published with the release is checked, which guards against transport corruption, not a compromised release. 'true' fails the step when the attestation cannot be verified; 'false' skips it. Releases before v0.4.9 carry no attestation."
    required: false
    default: "auto"
  sha256:
    description: "Expected SHA-256 of this runner's release tarball (verify-trust-<target>.tar.gz). Optional. A checksum pinned in your own reviewed workflow still holds if the release itself is compromised, unlike the one published alongside it — recommended, with an explicit `version`, wherever attestation cannot be verified (e.g. Forgejo runners)."
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Install verify-trust
      shell: bash
      # Portable across GitHub Actions and Forgejo Actions runners. Needs bash,
      # curl, tar, sha256sum or shasum, and outbound HTTPS to github.com — no
      # `gh`, and no token: the release is public and fetched anonymously.
      #
      # Integrity, by runner:
      #   * Always: the tarball must match the SHA-256 published next to it in
      #     the same release. Fetched from the same place as the tarball, this
      #     only catches transport corruption — whoever can replace a release
      #     asset can replace its checksum too.
      #   * `sha256` input set: the tarball must also match a checksum pinned in
      #     the caller's own reviewed workflow, which does survive a
      #     compromised release.
      #   * `gh` present and the runner on github.com (verify-attestation:
      #     auto): the tarball's build-provenance attestation must verify —
      #     signed by this repository's release.yml, on a GitHub-hosted runner,
      #     for this tag. That also survives a replaced release asset. It needs
      #     GitHub's attestation API and a GitHub token, which a Forgejo runner
      #     does not have (its job token belongs to the Forgejo instance).
      env:
        VGI_VERSION: ${{ inputs.version }}
        VGI_VERIFY_ATTESTATION: ${{ inputs.verify-attestation }}
        VGI_EXPECTED_SHA256: ${{ inputs.sha256 }}
        # Given to `gh` alone, and only when the runner is on github.com: on
        # Forgejo this is the Forgejo instance's token, which must never be
        # sent to GitHub. Deliberately not named GH_TOKEN, so no other command
        # in the script picks it up.
        VGI_GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail

        fail() { echo "::error::verify-trust: $*" >&2; exit 1; }

        # Every download goes through here: HTTPS only, redirects included
        # (the release CDN is reached by redirect), TLS 1.2 or later, retried,
        # and no credentials.
        fetch() {
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --retry 5 --retry-delay 2 --retry-connrefused --connect-timeout 20 "$@"
        }

        repo="OpenVTC/verifiable-git-infrastructure"
        releases="https://github.com/${repo}/releases"

        # --- platform: RUNNER_OS/RUNNER_ARCH when the runner sets them, else uname
        os="${RUNNER_OS:-}"
        if [ -z "$os" ]; then
          case "$(uname -s)" in
            Linux)                os=Linux ;;
            Darwin)               os=macOS ;;
            MINGW*|MSYS*|CYGWIN*) os=Windows ;;
            *)                    os="$(uname -s)" ;;
          esac
        fi
        arch="${RUNNER_ARCH:-}"
        if [ -z "$arch" ]; then
          case "$(uname -m)" in
            x86_64|amd64)  arch=X64 ;;
            arm64|aarch64) arch=ARM64 ;;
            *)             arch="$(uname -m)" ;;
          esac
        fi
        case "${os}-${arch}" in
          Linux-X64)   target=x86_64-unknown-linux-gnu ;;
          macOS-ARM64) target=aarch64-apple-darwin ;;
          macOS-X64)   target=x86_64-apple-darwin ;;
          Windows-X64) target=x86_64-pc-windows-msvc ;;
          *) fail "unsupported platform ${os}-${arch}: prebuilt binaries exist for Linux-X64, macOS-ARM64, macOS-X64 and Windows-X64" ;;
        esac

        # --- inputs
        case "$VGI_VERIFY_ATTESTATION" in
          auto|true|false) ;;
          *) fail "verify-attestation must be auto, true or false" ;;
        esac
        expected=""
        if [ -n "$VGI_EXPECTED_SHA256" ]; then
          expected="$(printf '%s' "$VGI_EXPECTED_SHA256" | tr 'A-F' 'a-f')"
          [[ "$expected" =~ ^[0-9a-f]{64}$ ]] || fail "sha256 must be 64 hex digits"
        fi

        # --- release tag. `latest` redirects to releases/tag/<tag>; read the
        # tag off where it lands. Either way it must look like a release tag
        # before it goes into a URL.
        tag="$VGI_VERSION"
        if [ "$tag" = "latest" ]; then
          landed="$(fetch --output /dev/null --write-out '%{url_effective}' "${releases}/latest")" \
            || fail "could not resolve the latest release of ${repo}"
          tag="${landed##*/}"
        fi
        [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] \
          || fail "version must be a release tag like v0.4.12, or 'latest'"

        # --- download
        if [ -n "${RUNNER_TEMP:-}" ]; then
          work="${RUNNER_TEMP}/vgi-verify-trust"
          rm -rf "$work"
          mkdir -p "$work"
        else
          work="$(mktemp -d)"
        fi
        cd "$work"
        asset="verify-trust-${target}.tar.gz"
        echo "Downloading ${asset} from ${repo}@${tag}"
        fetch --output "$asset" "${releases}/download/${tag}/${asset}" \
          || fail "could not download ${asset} from release ${tag}"
        fetch --output "${asset}.sha256" "${releases}/download/${tag}/${asset}.sha256" \
          || fail "could not download ${asset}.sha256 from release ${tag}"

        # --- integrity
        if command -v sha256sum >/dev/null 2>&1; then
          actual="$(sha256sum "$asset")"
        elif command -v shasum >/dev/null 2>&1; then
          actual="$(shasum -a 256 "$asset")"
        else
          fail "neither sha256sum nor shasum is available on this runner"
        fi
        actual="${actual%% *}"
        published="$(cat "${asset}.sha256")"
        published="$(printf '%s' "${published%% *}" | tr 'A-F' 'a-f')"
        [[ "$published" =~ ^[0-9a-f]{64}$ ]] || fail "the release's ${asset}.sha256 is malformed"
        [ "$actual" = "$published" ] \
          || fail "${asset} does not match the SHA-256 published with ${tag} (got ${actual}, expected ${published})"
        checks="SHA-256 published with the release (transport integrity only)"

        if [ -n "$expected" ]; then
          [ "$actual" = "$expected" ] \
            || fail "${asset} does not match the pinned sha256 input (got ${actual}, expected ${expected})"
          checks="${checks}; pinned sha256 input"
        fi

        on_github=false
        if [ "${GITHUB_SERVER_URL:-}" = "https://github.com" ]; then on_github=true; fi
        have_gh=false
        if command -v gh >/dev/null 2>&1; then have_gh=true; fi
        attest=false
        case "$VGI_VERIFY_ATTESTATION" in
          true)
            [ "$have_gh" = true ] || fail "verify-attestation is true but the gh CLI is not installed"
            [ "$on_github" = true ] \
              || fail "verify-attestation is true but this runner is not on github.com, so it has no token for GitHub's attestation API"
            attest=true ;;
          auto)
            if [ "$have_gh" = true ] && [ "$on_github" = true ]; then attest=true; fi ;;
        esac
        if [ "$attest" = true ]; then
          GH_TOKEN="$VGI_GITHUB_TOKEN" gh attestation verify "$asset" \
            --repo "$repo" \
            --signer-workflow "${repo}/.github/workflows/release.yml" \
            --source-ref "refs/tags/${tag}" \
            --deny-self-hosted-runners \
            || fail "${asset} has no valid build-provenance attestation from ${repo}'s release workflow for ${tag}"
          checks="${checks}; build-provenance attestation (release.yml @ refs/tags/${tag})"
        fi
        echo "verify-trust ${tag} (${target}) verified: ${checks}"

        # --- install
        tar xzf "$asset"
        dir="${work}/verify-trust-${target}"
        [ -f "${dir}/verify-trust" ] || [ -f "${dir}/verify-trust.exe" ] \
          || fail "${asset} did not contain verify-trust"
        [ -n "${GITHUB_PATH:-}" ] || fail "GITHUB_PATH is not set, so verify-trust cannot be put on PATH"
        echo "$dir" >> "$GITHUB_PATH"

    - name: Run verify-trust
      shell: bash
      # Every input reaches the script through the environment, never through
      # `${{ }}` in the script body: an expression there is pasted into the
      # script as text before bash parses it. Referenced as quoted variables,
      # the values stay data, whatever they contain.
      env:
        VT_RANGE: ${{ inputs.range }}
        VT_REGISTRY_DID: ${{ inputs.registry-did }}
        VT_VTC_DID: ${{ inputs.vtc-did }}
        VT_ACTION: ${{ inputs.action }}
        VT_RESOURCE: ${{ inputs.resource }}
        VT_MAX_SIGNERS: ${{ inputs.max-signers }}
        VT_REGISTRY_URL: ${{ inputs.registry-url }}
        VT_FALLBACK_RESOURCE: ${{ inputs.fallback-resource }}
        VT_RESOURCE_FORMAT: ${{ inputs.resource-format }}
        VT_EXEMPT_KEYRING: ${{ inputs.exempt-keyring }}
        VT_RESOLVE_AGENT_NAMES: ${{ inputs.resolve-agent-names }}
        VT_JSON: ${{ inputs.json }}
      run: |
        set -euo pipefail
        case "$VT_MAX_SIGNERS" in
          ''|*[!0-9]*) echo "::error::verify-trust: max-signers must be a non-negative integer"; exit 1 ;;
        esac
        case "$VT_RANGE" in
          -*) echo "::error::verify-trust: range must be a revision range, not an option"; exit 1 ;;
        esac
        args=(
          --range "$VT_RANGE"
          --registry-did "$VT_REGISTRY_DID"
          --vtc-did "$VT_VTC_DID"
          --action "$VT_ACTION"
          --max-signers "$VT_MAX_SIGNERS"
        )
        # Unset, verify-trust derives the resource from the runner's
        # environment (GITHUB_REPOSITORY, or the forge-qualified form).
        if [ -n "$VT_RESOURCE" ]; then
          args+=(--resource "$VT_RESOURCE")
        fi
        # Passed only when not the default, so a `version:` pinned to a release
        # that predates the flag keeps working.
        if [ -n "$VT_RESOURCE_FORMAT" ] && [ "$VT_RESOURCE_FORMAT" != "legacy" ]; then
          args+=(--resource-format "$VT_RESOURCE_FORMAT")
        fi
        if [ -n "$VT_REGISTRY_URL" ]; then
          args+=(--registry-url "$VT_REGISTRY_URL")
        fi
        if [ -n "$VT_FALLBACK_RESOURCE" ]; then
          args+=(--fallback-resource "$VT_FALLBACK_RESOURCE")
        fi
        if [ -n "$VT_EXEMPT_KEYRING" ]; then
          args+=(--exempt-keyring "$VT_EXEMPT_KEYRING")
        fi
        if [ "$VT_RESOLVE_AGENT_NAMES" = "true" ]; then
          args+=(--resolve-agent-names)
        fi
        if [ "$VT_JSON" = "true" ]; then
          args+=(--json)
        fi
        verify-trust "${args[@]}"
