name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repository; without this block the jobs would
# inherit the repository's default token permissions.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Actions are pinned to full commit SHAs (Dependabot keeps them current). The
# toolchain comes from the runner's preinstalled rustup rather than an action.
jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev libdbus-1-dev
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev libdbus-1-dev
      - run: cargo test --workspace
      - name: Test did-git-sign with the test-only policy bypass
        run: cargo test -p did-git-sign --features insecure-policy-bypass
      # The parent-process bypass is a test-only feature. A release build must
      # not honour it, so it must not even contain the variable's name.
      - name: Release did-git-sign carries no policy bypass
        run: |
          set -euo pipefail
          cargo build --release --locked -p did-git-sign
          if grep -a -q DID_GIT_SIGN_BYPASS_POLICY target/release/did-git-sign; then
            echo "::error::the release did-git-sign binary contains DID_GIT_SIGN_BYPASS_POLICY"
            exit 1
          fi

  msrv:
    name: Minimum Supported Rust Version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev libdbus-1-dev
      - run: cargo check --workspace
