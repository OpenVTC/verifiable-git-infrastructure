name: Publish

# Publish the three crates to crates.io in dependency order. Runs on a
# `vX.Y.Z` tag push (alongside release.yml), or manually via workflow_dispatch.
#
# The tag push — not `release: published` — is the trigger on purpose: a
# GitHub Release created by release.yml uses the default GITHUB_TOKEN, and
# GitHub does not let GITHUB_TOKEN-created events cascade-trigger other
# workflows, so a `release: published` handler would never fire. Keying off
# the tag push (done by a human/PAT) avoids that. Publishing is independent of
# the release binaries, so running in parallel with release.yml is fine.
#
# Auth is crates.io Trusted Publishing (OIDC) — no long-lived token. Setup per
# crate on crates.io: add this repo + this workflow (`publish.yml`) + the
# `crates-io` environment as a Trusted Publisher for `vgi-core`,
# `verify-trust`, and `did-git-sign`.
#
# Two jobs, so dependency code never runs next to the publishing credential:
#
#   - `package` builds and verifies every crate tarball (`cargo package`
#     compiles each one, running every dependency's build script). It has a
#     read-only token and no OIDC permission.
#   - `publish` runs only after `package` succeeds, only for a tag, and only
#     inside the `crates-io` environment. It holds the OIDC permission and
#     uploads with `--no-verify`, so it compiles nothing.
#
# A manual dispatch on a branch therefore packages and verifies without
# publishing. A dispatch on a `v*` tag publishes that tag, which is how a
# partial publish is retried.
#
# The run is resumable: each crate already on crates.io at the workspace version
# is skipped rather than re-published. Publishing is not atomic across three
# crates — an earlier one uploads, a later one can fail (a `git` dependency with
# no version requirement will do it, which is how v0.4.7 left `vgi-core` 0.4.7
# published against `verify-trust`/`did-git-sign` 0.4.6). Without the skip, the
# retry after fixing the cause dies on "already uploaded" for the crate that did
# land, and the only way forward is a version bump nothing else needed.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev libdbus-1-dev

      # Packages all three crates and compiles each from its tarball. cargo
      # resolves the workspace's own crates from the local packages, so this
      # works before vgi-core's new version is on crates.io.
      - name: Package and verify all crates
        run: cargo package --workspace --locked

  publish:
    name: Publish to crates.io
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write # OIDC token for crates.io Trusted Publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Authenticate to crates.io
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth

      - name: Publish in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail

          # Sparse-index path for a crate name, per the cargo registry layout:
          # 1- and 2-char names live under `1/` and `2/`, 3-char under
          # `3/<first>/`, and everything else under `<first two>/<next two>/`.
          index_path() {
            local name=$1
            case ${#name} in
              1) printf '1/%s\n'       "$name" ;;
              2) printf '2/%s\n'       "$name" ;;
              3) printf '3/%s/%s\n'    "${name:0:1}" "$name" ;;
              *) printf '%s/%s/%s\n'   "${name:0:2}" "${name:2:2}" "$name" ;;
            esac
          }

          # True when crates.io already holds <name> at exactly <version>. The
          # sparse index is newline-delimited JSON, one object per version, so
          # slurp it and ask whether any entry matches. A 404 (name never
          # published) is a clean "no".
          already_published() {
            local name=$1 version=$2 body
            body=$(curl -sSf "https://index.crates.io/$(index_path "$name")" 2>/dev/null) || return 1
            printf '%s\n' "$body" | jq -se --arg v "$version" 'any(.[]; .vers == $v)' >/dev/null
          }

          # vgi-core has no internal deps; verify-trust and did-git-sign both
          # depend on it. `cargo publish` waits for each crate to appear in
          # the index before returning, so the next one resolves it.
          for crate in vgi-core verify-trust did-git-sign; do
            version=$(cargo metadata --no-deps --format-version 1 \
              | jq -r --arg n "$crate" '.packages[] | select(.name == $n) | .version')
            if [ -z "$version" ]; then
              echo "::error::${crate} is not a member of this workspace"
              exit 1
            fi

            if already_published "$crate" "$version"; then
              echo "::notice::${crate} ${version} is already on crates.io — skipping"
              continue
            fi

            # The `package` job already compiled this exact commit's tarballs;
            # skipping verification here keeps build scripts out of the job
            # that holds the token.
            echo "::group::publish ${crate} ${version}"
            cargo publish -p "${crate}" --locked --no-verify
            echo "::endgroup::"
          done
