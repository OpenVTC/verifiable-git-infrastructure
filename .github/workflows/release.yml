name: Release

# Builds prebuilt binaries for each supported platform and attaches them to
# the GitHub Release for a `vX.Y.Z` tag:
#
#   - `verify-trust-<target>.tar.gz` — the download-based GitHub Action
#     (`.github/actions/verify-trust`) fetches these *by name*, so CI runners
#     need neither a Rust toolchain nor a source build. Keep the name stable.
#   - `vgi-bridge-<target>.tar.gz` — the community's bridge service, for
#     operators who run it without the container (bridge-image.yml builds
#     that). Linux and macOS only: on Windows the bridge's owner-only checks
#     on its master key and sealed credentials are no-ops (`seal.rs`), and a
#     binary that silently accepts a world-readable key is not one to ship.
#
# Every tarball has a `.sha256` beside it and, for a tag, a build-provenance
# attestation (`gh attestation verify <file> --repo <this repo>`).
#
# Trigger:
#   - push a tag `vX.Y.Z`         → build + attest + publish a Release
#   - workflow_dispatch (manual)  → build only (a dry run; no attestation, no Release)
#
# The binaries run in every downstream CI job that uses the action, so the
# build is kept narrow: no dependency cache (a cache written by another
# workflow could change what gets shipped), actions pinned to commit SHAs, and
# only the job that creates the Release can write to the repository.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.bin }} ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      # Build provenance for the tarballs: an OIDC token to sign the
      # attestation, and permission to store it on the repository.
      id-token: write
      attestations: write
    strategy:
      # One unsupported/flaky platform must not stop the others from
      # producing artifacts; the release job uploads whatever succeeded.
      fail-fast: false
      # One leg per (binary, target). `bin` is both the cargo package and the
      # binary name, and prefixes every asset and artifact name.
      matrix:
        include:
          - bin: verify-trust
            target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          # Cross-compile the Intel-macOS binary on the Apple-Silicon runner:
          # the x86_64-apple-darwin target builds with the stock toolchain (no
          # extra tooling) and avoids the scarce, slow-to-schedule macos-13
          # (Intel) runners that otherwise stall the whole release.
          - bin: verify-trust
            target: x86_64-apple-darwin
            os: macos-latest
          - bin: verify-trust
            target: aarch64-apple-darwin
            os: macos-latest
          - bin: verify-trust
            target: x86_64-pc-windows-msvc
            os: windows-latest
          # No Windows leg for the bridge: see the note at the top.
          - bin: vgi-bridge
            target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - bin: vgi-bridge
            target: x86_64-apple-darwin
            os: macos-latest
          - bin: vgi-bridge
            target: aarch64-apple-darwin
            os: macos-latest
    env:
      BIN: ${{ matrix.bin }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --target "$TARGET"
          rustup default stable

      - name: System dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev libdbus-1-dev

      - name: Build ${{ matrix.bin }}
        shell: bash
        run: cargo build --release --locked -p "$BIN" --target "$TARGET"

      # Package as a `.tar.gz` on every platform (git-bash on the Windows
      # runner provides tar + sha256sum), so downstream extraction is uniform.
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          bin="$BIN"
          if [ "$RUNNER_OS" = "Windows" ]; then bin="$BIN.exe"; fi
          stage="${BIN}-${TARGET}"
          mkdir "$stage"
          cp "target/${TARGET}/release/${bin}" "$stage/"
          cp README.md LICENSE "$stage/"
          # The bridge's own README (as README.md, replacing the workspace's)
          # and the annotated example config it is set up from.
          if [ "$BIN" = "vgi-bridge" ]; then
            cp crates/vgi-bridge/README.md crates/vgi-bridge/bridge.example.toml "$stage/"
          fi
          tar czf "${stage}.tar.gz" "$stage"
          # macOS runners ship `shasum`, not coreutils `sha256sum`.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${stage}.tar.gz" > "${stage}.tar.gz.sha256"
          else
            shasum -a 256 "${stage}.tar.gz" > "${stage}.tar.gz.sha256"
          fi

      # Only for a tag: an attestation from a dry run on an arbitrary branch
      # would verify just as well as one for a real release.
      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ matrix.bin }}-${{ matrix.target }}.tar.gz

      # Named per (binary, target) so the legs never collide; the release job
      # merges them all into one directory.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.bin }}-${{ matrix.target }}
          path: |
            ${{ matrix.bin }}-${{ matrix.target }}.tar.gz
            ${{ matrix.bin }}-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    # Only cut a Release for a tag; a manual dispatch is a build-only dry run.
    # `always()` so a single failed build leg still releases the rest.
    if: always() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Required reviewers and the `v*.*.*` tag rule are configured on the
    # environment in the repository settings.
    environment: release
    permissions:
      contents: write # create the Release and upload assets
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
