name: verify-trust

# VGI dogfoods its own commit-trust check. Dormant until the repo is
# configured: set the repository variables TRUST_REGISTRY_DID and VTC_DID.
# The registry's endpoint is discovered from its DID document, so there is no
# URL to configure. Who may sign here is a registry grant, not a file in this
# repo — enrolment, rotation and revocation all live in the VTC.
on:
  pull_request:

jobs:
  verify:
    name: Verify commit trust
    # Skip entirely until a registry is configured, so the check is a no-op
    # for forks and for this repo before enrolment.
    if: vars.TRUST_REGISTRY_DID != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Need the base ref present so `origin/<base>..HEAD` resolves.
          fetch-depth: 0

      - name: verify-trust
        uses: ./.github/actions/verify-trust
        with:
          range: origin/${{ github.base_ref }}..HEAD
          registry-did: ${{ vars.TRUST_REGISTRY_DID }}
          vtc-did: ${{ vars.VTC_DID }}
          # GitHub web-UI merge/squash commits are PGP-signed by web-flow;
          # they pass only via this committed keyring.
          exempt-keyring: .github/trusted-platform-keys.asc
