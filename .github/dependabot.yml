version: 2
updates:
  # Workflow and composite-action `uses:` refs are pinned to commit SHAs;
  # Dependabot moves the SHA and its version comment together.
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/verify-trust"
    schedule:
      interval: weekly
    # Wait a week before proposing a new release, so a hijacked or re-pointed
    # tag has time to be noticed. Security updates are not delayed.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"

  # The Forgejo image the adapter's live integration test runs, pinned by
  # digest in a Dockerfile that exists only to carry the pin.
  - package-ecosystem: docker
    directory: "/crates/vgi-forge-forgejo/tests/forgejo"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "test(deps)"

  # The bridge image's base images, pinned by digest.
  - package-ecosystem: docker
    directory: "/crates/vgi-bridge"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # `rand` is held at 0.8 by `pgp` 0.20, which takes `rand_core` 0.6 RNGs in
      # `SecretKeyParams::generate`; a 0.9+ `StdRng` does not implement those
      # traits. The workspace root already says so in the comment on `rand`, and
      # the only users are verify-trust's PGP test helpers
      # (src/pgp_exempt.rs, tests/verify_trust_e2e.rs). Dependabot proposed
      # 0.8.8 -> 0.10.2 anyway (#46), which fails to compile.
      #
      # Patch updates are left flowing, so a 0.8.x advisory still arrives.
      # Remove this entry once `pgp` supports rand 0.9+.
      - dependency-name: "rand"
        update-types:
          - "version-update:semver-major"
      # `p256` is held at 0.13, the line `ssh-key` 0.6 verifies with: verify-trust's
      # key-type tests build P-256 and FIDO P-256 signatures with it and hand them
      # to ssh-key. 0.14 drops `to_encoded_point` and ssh-key 0.6 has no
      # `Signature: TryFrom<ecdsa::Signature<NistP256>>` for it (#190 failed to
      # compile). Remove this entry when ssh-key 0.7 is stable and we move to it.
      - dependency-name: "p256"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-minor"
