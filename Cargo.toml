[workspace]
members = [
    "crates/vgi-core",
    "crates/verify-trust",
    "crates/did-git-sign",
    "crates/vgi-forge",
    "crates/vgi-forge-github",
    "crates/vgi-forge-forgejo",
    "crates/vgi-bridge",
    "crates/vgi-cli",
]
resolver = "3"

[workspace.package]
version = "0.5.1"
edition = "2024"
rust-version = "1.95.0"
authors = ["Glenn Gore <glenn@affinidi.com>"]
license = "Apache-2.0"
repository = "https://github.com/OpenVTC/verifiable-git-infrastructure"
publish = true

[workspace.dependencies]
# VGI shared primitives (sshsig codec, commit handling, DID key extraction).
vgi-core = { version = "0.5.1", path = "crates/vgi-core" }
# Forge-neutral adapter trait and types for the git-namespaces bridge.
vgi-forge = { version = "0.5.1", path = "crates/vgi-forge" }
# The adapters and the verifier, for the bridge.
vgi-forge-github = { version = "0.5.1", path = "crates/vgi-forge-github" }
vgi-forge-forgejo = { version = "0.5.1", path = "crates/vgi-forge-forgejo" }
verify-trust = { version = "0.5.1", path = "crates/verify-trust" }
# Trust Registry query client (registry authorization queries).
#
# Held on a git `rev` for several releases while the registry workspace caught
# up: 0.14.0 was the latest published crate and declared `trust-tasks-rs ^0.9`
# against a stack that had moved to ^0.17, so taking it would have put two
# copies of trust-tasks in the tree. The pin pointed at the head of
# affinidi-trust-registry-rs#128 instead, which is the commit that cut 0.15.0.
#
# That scaffolding is now retired: the registry has published through 0.16.0,
# which declares `trust-tasks-rs ^0.18` — the same line vta-sdk 0.34 resolves —
# so this is back to a plain version requirement, as the note it replaces said
# it should be. `cargo publish` rejects git dependencies outright, so
# `publish.yml` could not have got past the manifest on a `vX.Y.Z` tag while
# the rev stood; that blocker is gone. It was not the only one: the partial
# v0.4.7 release had left `vgi-core` 0.4.7 on crates.io with content predating
# `signer_did` / `conflicting_signer_dids`, against `verify-trust` and
# `did-git-sign` still at 0.4.6 — and since `publish.yml` skips any crate
# already published at the workspace version, a second `v0.4.7` tag would have
# skipped vgi-core and built its dependents against that stale copy. Hence the
# 0.4.8 bump: the version is the thing that makes vgi-core republish.
#
# 0.17.0 closes the last of that: it is the registry's release of commit
# d99228a ("take trust-tasks 0.19.4, tdk 0.13 and vta-sdk 0.35", #133), so it
# declares `trust-tasks-rs ^0.19.4` — the same line vta-sdk 0.35 resolves.
# 0.16 briefly sat one line behind while vta-sdk went to 0.35, which split
# trust-tasks into 0.18.11 (through trql-client) and 0.19.4 (everything else);
# that gap is closed and `cargo tree -i trust-tasks-rs` resolves a single node
# again. It was held at 0.16 rather than taken as a git `rev` in the meantime,
# because a rev would have re-blocked publishing to buy a duplicate that was
# already tolerable — the wait was the cheaper side of that trade.
#
# The check when this moves is that single node, and it is the strict form:
# one `trust-tasks-rs` row, not an expected parent chain for a second copy.
# The weaker form was only ever justified by where the residue landed
# (verify-trust sends TRQP queries through trql-client's HTTPS transport and
# passes no trust-tasks type across that boundary, and did-git-sign — the crate
# OpenVTC consumes — has no trql-client edge at all). Prefer the strict form
# while it holds: if a bump here or in vta-sdk splits trust-tasks again, that
# is a decision to make deliberately, not to discover later in a consumer.
#
# 0.16.0 dropped the AWS SDK's legacy hyper-0.14 client from the registry's
# graph, and with it the h2 0.3 / rustls 0.21 advisories that workspace had
# been suppressing.
#
# 0.17 -> 0.18 closes the trust-tasks split the 0.36 step opened knowingly. That
# step took vta-sdk to the 0.20 trust-tasks line while trql-client 0.17 was still
# the registry's latest release and declared `^0.19.4`, so the tree carried two
# trust-tasks-rs copies (the weaker form this note bounds — verify-trust passes
# no trust-tasks type across the trql-client boundary, and did-git-sign, the
# crate OpenVTC consumes, has no trql-client edge). 0.18 is the registry release
# cut for exactly this move: it declares `^0.21`, the same line vta-sdk 0.42
# resolves, so `cargo tree -i trust-tasks-rs` is back to a single node — the
# strict form this note prefers. Taken together with the vta-sdk 0.39 -> 0.42
# step below; the registry published 0.18 so this workspace could land the whole
# frontier at once rather than leaving the split standing behind a fresh pin.
#
# 0.19 -> 0.20 is the step that retires the split for good. The registry
# published trql-client 0.20.0 declaring `trust-tasks-rs ^0.23.0` — the same
# line vta-sdk 0.53 resolves and the same line the bridge's own
# `trust-tasks-rs` requirement (below) already pins — so `cargo tree -i
# trust-tasks-rs` is one node across the *entire* workspace now, not two. The
# `trust-tasks-trql` alias this note used to carry (a separate `package =
# "trust-tasks-rs"` pin held at 0.21.21 because trql-client 0.19's own
# `TrqlTransport` trait spoke a 0.21 `TrustTask`) is retired along with it:
# verify-trust names the workspace's single `trust-tasks-rs` directly now.
# There is no source change in trql-client between 0.19.0 and 0.20.0 — the
# Rust it ships is byte-identical; only its own `trust-tasks-rs` requirement
# moved — so this was a manifest-only step for this workspace.
trql-client = "0.20"
# VTA client for signing with DID-held keys, and the `display_name` module
# (NameBook / shorten_did / verified agent names) shared with the PNM, CNM
# and VTC operator CLIs so every surface abbreviates a DID the same way.
# Features are chosen per member: did-git-sign needs the client and
# provisioning stack, verify-trust needs only `agent-names`.
# The 0.27 line, matching what the VTA/VTC deploy (vta-service 0.19 is built on
# it) and what OpenVTC's CLI runs on. This requirement is a *follow*, never a
# lead: OpenVTC depends on both this crate and vta-sdk directly, so whichever
# line it moves to, a stale requirement here puts a *second* vta-sdk in its
# binary. That is not merely untidy — `vti-common` re-exports
# `vta_sdk::acl::{ActScope, ApproveScope, ContextDirection}` as its own public
# API, so the two copies carry types that cannot unify.
#
# It has happened three times now (0.21 held while OpenVTC moved to 0.23, 0.23
# while it moved to 0.24, 0.25 while it moved to 0.27), so treat it as a standing
# obligation rather than an incident: when vta-sdk's minor moves, this moves with
# it, and the check is `cargo tree -i vta-sdk` resolving a single node — here
# *and* in OpenVTC, which is where the duplicate actually lands. Note that the
# obligation is only discharged by a *published release*: main moving is what
# OpenVTC cannot consume, and that is precisely how the last two were found.
#
# 0.25 -> 0.27 crossed two minors and required no source change here. The two
# things it carries are VTI #1033 (the Trust-Task response decode, where the
# agent had moved to `basePath` and the client still demanded `base_path` —
# `ContextResponse` is one of the eleven affected, and `names.rs` reads it) and
# VTI #1012 (`VtaClient::idempotent`, one idempotency key held across every
# attempt of an operation).
#
# 0.27 -> 0.31 is the same shape: four minors, no source change here, taken
# alongside the trust-tasks 0.17 / TDK 0.10 refresh across the stack.
#
# 0.31 -> 0.32 is one more of the same, and it is a *follow*, not a choice: this
# crate is the reason OpenVTC cannot move. `vta-sdk` is 0.x, so `"0.31"` excludes
# 0.32, and a consumer that takes 0.32 while `did-git-sign` asks for 0.31 gets
# two copies of `vta-sdk` — which do not unify, so the workspace stops building.
# That has now blocked the same consumer five times (0.23, 0.25, 0.27, 0.31,
# 0.32). Nothing here needs 0.32: this crate reaches the VTA through
# `connect_auto` and takes display names, so the API it uses is unchanged
# (`ClientIdentity` grew a `verification_method` member in 0.32 — VTI #1193 —
# and nothing here names that type). The bump exists so the ceiling moves.
#
# 0.32 -> 0.34 is the sixth, and the same shape again: OpenVTC is moving to the
# line VTI main deploys (vta-sdk 0.34, vta-service 0.24, trust-tasks 0.18, TDK
# 0.12), and this requirement is the edge that decides whether its graph holds
# one sdk or two. What 0.33/0.34 change is the shape of the wire bodies — VTI
# #1270/#1271 made `AclEntry` and `AppStateWrite` `#[non_exhaustive]`, and
# #1280 replaced `create_acl`'s positional arguments with `CreateAclParams` —
# and this workspace names none of those types, so again the bump exists only so
# the ceiling moves. `affinidi-tdk` goes to 0.12 in the same step because that
# is what vta-sdk 0.34 declares.
#
# 0.34 -> 0.35 is the seventh, and it is the one place this comment's rule is
# knowingly broken: it *leads* the consumer rather than following it. VTI main
# is already on this line (tdk 0.13, trust-tasks 0.19.4) but OpenVTC main is
# still on vta-sdk 0.34.1 / tdk 0.12 / trust-tasks 0.18.5 with no branch in
# flight, so until it moves, a build that takes both this crate and vta-sdk
# directly resolves 0.34.1 and 0.35.0 together — and `vti-common` re-exports
# `vta_sdk::acl::{ActScope, ApproveScope, ContextDirection}` as its own public
# API, so those two copies carry types that cannot unify.
#
# That was accepted deliberately (2026-09-10) to get this workspace onto the
# published head, with OpenVTC to be moved separately. It is a temporary,
# *known* break, not a new licence to lead: the standing obligation is still
# that this requirement follows, and the debt is only discharged when OpenVTC
# takes vta-sdk 0.35. Nothing here needs 0.35 — this crate reaches the VTA
# through `connect_auto` and takes display names — so as before the bump exists
# only so the ceiling moves. `affinidi-tdk` goes to 0.13 in the same step
# because that is what vta-sdk 0.35 declares.
#
# 0.35 -> 0.36 is the eighth, and it goes back to following. OpenVTC is moving
# to the 0.36 line for peer identity vetting (VTI #1425 onward adds the `vetting`
# feature and `protocols::vetting`, which OpenVTC's vetting branches take), and
# vta-service 0.25.1 — the MockVta its tests boot — already requires `^0.36`. A
# did-git-sign still asking for 0.35 is the edge that would put a second sdk in
# OpenVTC's binary. Nothing here needs 0.36: this crate reaches the VTA through
# `connect_auto` and takes display names, so as before the bump exists only so
# the ceiling moves. `affinidi-tdk` goes to 0.14 because that is what vta-sdk
# 0.36 declares.
#
# This step knowingly splits trust-tasks *here*: trql-client 0.17 is still the
# registry's latest release and declares `^0.19.4`, while vta-sdk 0.36 is on
# 0.20. That is the weaker form the trql-client note above describes and bounds
# — verify-trust passes no trust-tasks type across the trql-client boundary, and
# did-git-sign, the crate OpenVTC consumes, has no trql-client edge — so
# OpenVTC's graph still resolves one node. It closes when the registry releases
# on 0.20; waiting for that would have held OpenVTC's vetting work on a release
# nothing here needs.
#
# Same discipline as the trql-client requirement above, and the same check —
# `cargo tree -i vta-sdk` resolving a single node, here *and* in OpenVTC, which
# is where the duplicate actually lands.
#
# **This line moves first, and that is the whole point of moving it.** VTI
# published vta-sdk 0.39 (a major: `verify_trust_task_proof_with` became generic
# over the payload, and `KeyType` gained ML-DSA variants). While this crate
# declared `^0.38`, OpenVTC could not follow — it consumes did-git-sign, so
# raising its own pin resolved *two* sdk copies, which is the state its manifest
# records having escaped for the first time since 0.35. One row here is one row
# there; a stale row here is a duplicate there.
#
# 0.39 -> 0.42 is the same "moves first" step, and again it is the whole point.
# VTI published the 0.42 frontier (vta-sdk 0.42.0, affinidi-tdk 0.16.0,
# affinidi-messaging-sdk 0.26.7, trust-tasks-rs 0.21.3, didwebvh-rs 0.7.0), and
# OpenVTC's rev3 line already pins `vta-sdk 0.42.0` directly — but it consumes
# did-git-sign, and while this crate declared `^0.39`, OpenVTC's graph dragged in
# a *second*, broken vta-sdk 0.39 copy through it. Publishing this workspace on
# 0.42 is what lets that duplicate collapse to one node in the consumer. One row
# here is one row there.
#
# The bump crosses three minors (0.39, 0.40, 0.41, 0.42) but needs no source
# change here: did-git-sign reaches the VTA through `connect_auto` and takes
# display names, and verify-trust never talks to a VTA at all (it takes only
# `agent-names`), so the client/session/didcomm surface those minors reshaped is
# not named by anything in this workspace. `cargo build --workspace` and
# `cargo test --workspace` pass unchanged. `affinidi-tdk` goes to 0.16 because
# that is what vta-sdk 0.42 declares; trust-tasks-rs resolves to a single 0.21.3
# node once trql-client 0.18 (above) lines up with it.
#
# Old floor notes (0.21.10 for trust-tasks-rs 0.4; the 0.23 move in #26) are
# below this line by construction and kept in git history rather than as a wall
# of satisfied constraints.
#
# `affinidi-tdk` 0.17 is the line vta-sdk 0.51 declares, so it and the messaging
# SDK it carries (0.27) resolve one node instead of a 0.16/0.26 copy beside the
# 0.17/0.27 one.
#
# 0.51 -> 0.53 carries `InboundMessage` gaining `claimed_from` / `verified_signer`
# and the new `DiProofError::WrongPurpose` variant, and moves
# `provision_integration_didcomm` to eight parameters — none of it named by this
# workspace (did-git-sign and vgi-bridge reach the VTA through `connect_auto`
# and take display names / session helpers, not that constructor), so the bump
# needs no source change here. `affinidi-tdk` goes to 0.18 and
# `affinidi-messaging-sdk` to 0.28 because that is what vta-sdk 0.53 declares —
# and, unlike every step before it, this is also the step that lands
# `trust-tasks-rs` on 0.23: the bridge's own `trust-tasks-rs` requirement
# (below) was already there, so this closes that gap down to the one residual
# node the `trust-tasks-trql` note above described (trql-client 0.19 itself
# still speaking `^0.21`). `trust-tasks-proof` is a single 0.23.0 node now.
# That residual closed for good in the 0.5.1 release: trql-client 0.20
# declares `trust-tasks-rs ^0.23.0` too, so the `trust-tasks-trql` alias is
# gone and `cargo tree -i trust-tasks-rs` is one node, full stop.
vta-sdk = { version = "0.53", default-features = false }
affinidi-tdk = "0.18"
# **Security floor**, named for it alone. 0.27.2 (with the DIDComm crate's
# 0.15.9 below) binds an authcrypt message's reported sender to the key the
# key agreement actually used — `skid` must equal the `apu` party info, and
# the decrypted sender key id must be that `skid`. Before it, the sender the
# SDK reported came from `apu` while the key it resolved came from `skid`, so
# the unpacked sender was not proof of origin. The bridge's DIDComm registry
# queries believe that sender, so they require these versions.
#
# The 0.26 SDK line must not come back into this graph: it declares
# `affinidi-messaging-didcomm = "0.15"`, and against 0.15.9 its unpack calls
# the deprecated `decrypt`, which now refuses every authcrypt message — the
# 0.26 line cannot receive DIDComm at all on the fixed crate.
affinidi-messaging-sdk = "0.28.1"
affinidi-messaging-didcomm = "0.15.9"
# Named directly for one reason: the **floor**. The verifier resolves DIDs a
# pull-request author chose — the `Signed-by-DID` trailer and the committer
# header are attacker-supplied on a fork PR — so which hosts resolution may
# contact is a property this workspace has to be able to state.
#
# `affinidi-tdk` reaches this crate as `^0.8`, which silently admits 0.8.36,
# where `did:webvh` resolution contacts whatever host the DID names:
# `did:webvh:{SCID}:localhost%3A<port>` was fetched over `http://`, and any
# other name from whatever address it resolved to. On a self-hosted runner with
# internal reachability that is an SSRF primitive with the resolution error as
# its oracle. 0.8.37 is the release that closes it — `didwebvh-rs` 0.7 refuses
# non-public names before any request, vets every resolved address, refuses
# redirects and ignores proxies — and `did:web` has been guarded since 0.8.35.
#
# `build_resolver` states `HostPolicy::PublicOnly` rather than relying on the
# default, so a downgrade below 0.8.37 fails to compile (`with_host_policy` does
# not exist before it) instead of quietly reopening the fetch. That is the whole
# reason this is a normal dependency and not a dev-dependency: a floor in
# `[dev-dependencies]` would not travel with the published crate, and
# `did-git-sign` — the crate OpenVTC consumes — resolves through the same graph.
#
# No feature is chosen here: `affinidi-tdk` already takes this crate with its
# default features, so this line adds a version requirement and nothing else.
affinidi-did-resolver-cache-sdk = "0.8.37"
multibase = "0.9"
pgp = "0.20"
clap = { version = "4.6", features = ["derive"] }
tokio = "1.53"
serde = "1.0"
serde_json = "1.0"
anyhow = "1.0"
keyring-core = "1"
zeroize = "1.9"
dirs = "7.0"
base64 = "0.23"
ed25519-dalek = "3.0"
ssh-key = { version = "0.6", features = ["ed25519", "crypto"] }
sha2 = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dialoguer = { version = "0.12", features = ["password"] }
sysinfo = "0.39"
chrono = "0.4"
hex = "0.4"
# Message ids for the registry queries verify-trust sends over a mediator.
uuid = { version = "1", features = ["v4"] }
apple-native-keyring-store = { version = "1", features = ["keychain"] }
linux-keyutils-keyring-store = "1"
windows-native-keyring-store = "1"
# Pinned to 0.8 by pgp 0.20, which takes rand_core 0.6 RNGs in its
# key-builder/signing APIs (used only by the PGP-exemption test fixtures).
rand = "0.8"
tempfile = "3"
serial_test = "4"
# Property-based testing: used by vgi-core's trailer differential against git.
proptest = "1"
# YAML parser for the CI-workflow structural tests. A parser, not a regex: the
# check is "no `${{ }}` inside a `run:` scalar", which is a statement about the
# YAML tree. Matching the text instead finds the same marker in a comment or a
# description and reports it as a finding.
yaml-rust2 = "0.13"

# ── forge adapters (vgi-forge, vgi-forge-github) ────────────────────────────
# Every crate below except wiremock was already in this workspace's graph
# before the adapters arrived — through the TDK's HTTPS and TLS stack — so the
# adapters add requirements, not new code to audit: `cargo tree -e normal`
# gains no package. wiremock and its handful of dependencies are dev-only.
#
# `Forge` is object-safe through async-trait: the bridge holds adapters as
# `Box<dyn Forge>` keyed by forge host, which native `async fn` in traits
# cannot express without hand-boxing every method.
async-trait = "0.1"
# `HeaderMap` for webhook headers — the type every Rust HTTP server hands out.
http = "1"
# The GitHub adapter's HTTP client. Default features off: rustls with the
# aws-lc-rs provider the TDK already builds, JSON bodies, HTTP/2 and system
# proxies, and nothing else (no cookies, no native-tls, no decompression).
reqwest = { version = "0.13", default-features = false, features = [
    "rustls",
    "json",
    "http2",
    "system-proxy",
] }
url = "2.5"
# RS256 for the GitHub App JWT, HMAC-SHA256 for webhook signatures and the
# CSPRNG for bind nonces: the provider rustls already links here, rather than
# the pure-Rust `rsa` crate, whose private-key operations carry the unfixed
# Marvin timing advisory (RUSTSEC-2023-0071). Default features off: the
# ring-compatibility shims pull `untrusted`, which nothing here needs.
aws-lc-rs = { version = "1.18", default-features = false, features = ["aws-lc-sys"] }
# HTTP mocking for the adapter tests. Dev-only; no test touches the network.
wiremock = "0.6"
# An in-process mediator (memory store, loopback port) for verify-trust's
# mediator-binding tests: the run's ephemeral DID really connects, a fake
# registry on the same mediator really answers, and an `ExplicitAllow`
# mediator really refuses. Dev-only. 0.11 is the line on the messaging SDK
# 0.28 / TDK 0.18 that verify-trust's transports and the bridge use.
affinidi-messaging-test-mediator = { version = "0.11.1", features = ["tsp"] }

# ── the bridge (vgi-bridge) ─────────────────────────────────────────────────
# The per-community service that holds the forge credentials and runs the
# adapters (design §5.7). Everything below is used by vgi-bridge alone; none of
# it reaches verify-trust, vgi-core or did-git-sign.
#
# The git-ns/bridge/{job,result,event} payload types are generated from the
# normative specifications and published in trust-tasks-rs (`specs::
# git_ns`), so the bridge takes that line.
#
# 0.23 carries `git-ns/bridge/job` 0.4 generated (`specs::git_ns::bridge::
# job::v0_4`; wire-identical to 0.3, so the swap from the generated 0.3
# types this bridge previously read it with is source-only) and
# `git-ns/namespace/reseat` 0.3, on top of everything the 0.22 line already
# carried.
#
# The vta-sdk 0.53 step (above) landed vta-sdk on this same 0.23 line, and the
# 0.5.1 release's trql-client 0.20 bump (above) closed the one residual node
# that split had left: trql-client 0.20 declares `trust-tasks-rs ^0.23.0`
# too, so `cargo tree -i trust-tasks-rs` is a single node — this one, vta-sdk,
# verify-trust and trql-client all resolve it — rather than the two the
# `trust-tasks-trql` alias used to bound. That alias is gone; verify-trust
# names this same `trust-tasks-rs` directly now. The bridge is `publish =
# false`, and signs and verifies with trust-tasks-proof on the same 0.23
# line.
trust-tasks-rs = { version = "0.23", default-features = false, features = ["git-ns"] }
# Data Integrity sign/verify for Trust Task documents (eddsa-jcs-2022), on the
# same line as the payload types. Its affinidi-data-integrity and DID-resolver
# dependencies are the versions the TDK already builds here.
trust-tasks-proof = "0.23.0"
# The DIDComm delivery layer over the mediator websocket — the stack
# vtc-service uses. Both are already in the graph through affinidi-tdk's
# messaging SDK; they are named so the bridge keeps the proven sender of each
# inbound message, which vta-sdk's session helpers drop (and those helpers also
# flush the mediator inbox on connect, which would lose queued jobs).
affinidi-messaging-delivery = "0.1.18"
affinidi-messaging-core = "0.1.10"
# The bridge's HTTP surface (GitHub App registration, setup and webhooks;
# Forgejo OAuth redirects and webhooks). axum is the VTI stack's server
# (vtc-service, vta-service); hyper, hyper-util and tower under it are already
# in the graph through reqwest, so it adds axum, axum-core and a router.
# Default features off: HTTP/1 only (TLS terminates at the proxy in front),
# query strings and tokio — no JSON extractor, no multipart, no websockets.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query"] }
# Durable state: a pure-Rust, single-file, ACID key-value store with no
# dependencies of its own. The bridge's state is small (bindings, pins, a job
# ledger) and written rarely; fjall, which VTI uses, is an LSM engine with
# background compaction — more machinery than a few hundred records need.
redb = "4"
# The operator's config file.
toml = "1"
# Stream combinators over the delivery layer's inbound stream (already in the
# graph through the messaging SDK).
futures-util = "0.3"
# `ServiceExt::oneshot` for the bridge's HTTP tests. Dev-only; already in the
# graph under axum and reqwest.
tower = { version = "0.5", default-features = false, features = ["util"] }
