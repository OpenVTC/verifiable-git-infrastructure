[workspace]
members = ["crates/vgi-core", "crates/verify-trust", "crates/did-git-sign"]
resolver = "3"

[workspace.package]
version = "0.4.2"
edition = "2024"
rust-version = "1.95.0"
authors = ["Glenn Gore <glenn@affinidi.com>"]
license = "Apache-2.0"
repository = "https://github.com/OpenVTC/verifiable-git-infrastructure"
publish = true

[workspace.dependencies]
# VGI shared primitives (sshsig codec, commit handling, DID key extraction).
vgi-core = { version = "0.4.2", path = "crates/vgi-core" }
# Trust Registry query client (registry authorization queries). 0.11 still
# builds its task specs against trust-tasks-rs 0.3, so the tree carries that
# alongside the 0.4 the VTA stack pulls in. The two never meet: verify-trust
# only sends TRQP queries through trql-client's HTTPS transport, and takes
# nothing but display names from vta-sdk.
trql-client = "0.11"
# VTA client for signing with DID-held keys, and the `display_name` module
# (NameBook / shorten_did / verified agent names) shared with the PNM, CNM
# and VTC operator CLIs so every surface abbreviates a DID the same way.
# Features are chosen per member: did-git-sign needs the client and
# provisioning stack, verify-trust needs only `agent-names`.
# Floor is 0.21.10: that is the first release built on trust-tasks-rs 0.4.
vta-sdk = { version = "0.21.10", default-features = false }
affinidi-tdk = "0.8.5"
multibase = "0.9"
pgp = "0.20"
clap = { version = "4.6", features = ["derive"] }
tokio = "1.53"
serde = "1.0"
serde_json = "1.0"
anyhow = "1.0"
keyring-core = "1"
zeroize = "1.9"
dirs = "6.0"
base64 = "0.23"
ed25519-dalek = "3.0"
ssh-key = { version = "0.6", features = ["ed25519", "crypto"] }
sha2 = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dialoguer = { version = "0.12", features = ["password"] }
sysinfo = "0.39"
chrono = "0.4"
hex = "0.4"
apple-native-keyring-store = { version = "1", features = ["keychain"] }
linux-keyutils-keyring-store = "1"
windows-native-keyring-store = "1"
# Pinned to 0.8 by pgp 0.20, which takes rand_core 0.6 RNGs in its
# key-builder/signing APIs (used only by the PGP-exemption test fixtures).
rand = "0.8"
tempfile = "3"
serial_test = "4"
