[workspace]
members = ["crates/vgi-core", "crates/verify-trust", "crates/did-git-sign"]
resolver = "3"

[workspace.package]
version = "0.4.4"
edition = "2024"
rust-version = "1.95.0"
authors = ["Glenn Gore <glenn@affinidi.com>"]
license = "Apache-2.0"
repository = "https://github.com/OpenVTC/verifiable-git-infrastructure"
publish = true

[workspace.dependencies]
# VGI shared primitives (sshsig codec, commit handling, DID key extraction).
vgi-core = { version = "0.4.4", path = "crates/vgi-core" }
# Trust Registry query client (registry authorization queries).
#
# Held at 0.11 for a long time, which built its task specs against
# trust-tasks-rs 0.3 while the VTA stack pulled 0.4 and then 0.6 — three copies
# in the tree at once. That was tolerated on the argument that the two never
# meet (verify-trust only sends TRQP queries through trql-client's HTTPS
# transport, and takes nothing but display names from vta-sdk), which was true
# but relied on nobody ever passing a trust-tasks type across the boundary.
#
# 0.13 builds against trust-tasks-rs ^0.6 — the same line vta-sdk 0.24 resolves
# — so the tree now carries a single copy and the argument no longer has to
# hold. Keep it that way: the check is `cargo tree -d -e normal,build` listing
# no trust-tasks-rs. This requirement follows the trust registry's published
# line for the same reason vta-sdk's does below.
trql-client = "0.14"
# VTA client for signing with DID-held keys, and the `display_name` module
# (NameBook / shorten_did / verified agent names) shared with the PNM, CNM
# and VTC operator CLIs so every surface abbreviates a DID the same way.
# Features are chosen per member: did-git-sign needs the client and
# provisioning stack, verify-trust needs only `agent-names`.
# The 0.24 line, matching what the VTA/VTC deploy and what OpenVTC's CLI runs
# on. This requirement is a *follow*, never a lead: OpenVTC depends on both this
# crate and vta-sdk directly, so whichever line it moves to, a stale requirement
# here puts a *second* vta-sdk in its binary. That is not merely untidy —
# `vti-common` re-exports `vta_sdk::acl::{ActScope, ApproveScope,
# ContextDirection}` as its own public API, so the two copies carry types that
# cannot unify.
#
# It has happened twice now (0.21 held while OpenVTC moved to 0.23, then 0.23
# held while it moved to 0.24), so treat it as a standing obligation rather than
# an incident: when vta-sdk's minor moves, this moves with it, and the check is
# `cargo tree -i vta-sdk` resolving a single node — here *and* in OpenVTC, which
# is where the duplicate actually lands.
#
# Old floor notes (0.21.10 for trust-tasks-rs 0.4; the 0.23 move in #26) are
# below this line by construction and kept in git history rather than as a wall
# of satisfied constraints.
vta-sdk = { version = "0.25", default-features = false }
affinidi-tdk = "0.8.5"
multibase = "0.9"
pgp = "0.20"
clap = { version = "4.6", features = ["derive"] }
tokio = "1.53"
serde = "1.0"
serde_json = "1.0"
anyhow = "1.0"
keyring-core = "1"
zeroize = "1.9"
dirs = "6.0"
base64 = "0.23"
ed25519-dalek = "3.0"
ssh-key = { version = "0.6", features = ["ed25519", "crypto"] }
sha2 = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dialoguer = { version = "0.12", features = ["password"] }
sysinfo = "0.39"
chrono = "0.4"
hex = "0.4"
apple-native-keyring-store = { version = "1", features = ["keychain"] }
linux-keyutils-keyring-store = "1"
windows-native-keyring-store = "1"
# Pinned to 0.8 by pgp 0.20, which takes rand_core 0.6 RNGs in its
# key-builder/signing APIs (used only by the PGP-exemption test fixtures).
rand = "0.8"
tempfile = "3"
serial_test = "4"
