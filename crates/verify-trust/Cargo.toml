[package]
name = "verify-trust"
description = "CI verifier for VGI: checks that every commit in a git range is signed by a DID the community's Trust Registry currently authorizes."
readme = "README.md"
keywords = ["git", "did", "ci", "trust-registry", "signatures"]
categories = ["command-line-utilities", "development-tools"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "verify-trust"
path = "src/main.rs"

[features]
# The registry bindings verify-trust can query over, beside HTTPS (always
# built). Discovery picks the highest-preference binding the registry's DID
# document advertises *and* this build has — TSP, then DIDComm, then HTTPS —
# so a registry need not publish a REST service at all.
#
# Both are default: the CLI and the release binaries speak every binding. The
# cost is small — DIDComm rides the messaging SDK the TDK already links (its
# `messaging` feature is default-on), and TSP adds `affinidi-tsp`. A build
# with `--no-default-features` is HTTPS-only and fails a registry that
# advertises nothing else, naming both sides' bindings.
default = ["didcomm", "tsp"]
didcomm = []
tsp = ["affinidi-tdk/tsp"]

[dependencies]
vgi-core = { workspace = true }
trql-client = { workspace = true }
# `TrustTask`, for the mediator transports' `TrqlTransport` impls. Since
# trql-client 0.20 this is the same node trql-client, vta-sdk and the bridge
# all resolve — see the workspace manifest's `trql-client` note — so this
# names the workspace's single `trust-tasks-rs` directly rather than a
# separate `trust-tasks-trql` alias.
trust-tasks-rs = { workspace = true }
async-trait = { workspace = true }
uuid = { workspace = true }
base64 = { workspace = true }
affinidi-tdk = { workspace = true }
# Security floors, not new code: the messaging SDK and DIDComm crate the TDK
# already builds, at the releases that bind an authcrypt sender to the key
# actually used. See the workspace manifest.
affinidi-messaging-sdk = { workspace = true }
affinidi-messaging-didcomm = { workspace = true }
# The resolver the TDK above builds, named directly so `build_resolver` can
# state the host policy it runs under. See the workspace manifest.
affinidi-did-resolver-cache-sdk = { workspace = true }
# Display names only — the verifier never talks to a VTA, so it takes
# `agent-names` (NameBook, shorten_did, the verified name round trip) without
# the client/DIDComm stack.
vta-sdk = { workspace = true, features = ["agent-names"] }
pgp = { workspace = true }
ssh-key = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
ed25519-dalek = { workspace = true }
tempfile = { workspace = true }
rand = { workspace = true }
# Parses `.github/` for the workflow-injection regression test.
yaml-rust2 = { workspace = true }
# The mediator-binding tests (tests/mediated.rs).
affinidi-messaging-test-mediator = { workspace = true }
# The forged-envelope regression test in tests/mediated.rs builds a JWE.
sha2 = { workspace = true }
