# The Trust Task specifications the bridge generates its wire types from
# (`build.rs`, `vgi_bridge::specs`). `trust-tasks add`, `remove` and `update`
# (trust-tasks-cli) edit this file; `trust-tasks.lock` records what each entry
# resolved to, and `trust-tasks/` holds the bundles it pins by digest. The
# framework specifications (`trust-task-discovery`, `trust-task-error`) come
# with the runtime and are not listed.
[tasks]
"git-ns/bridge/event" = "0.5"
"git-ns/bridge/job" = "0.6"
"git-ns/bridge/result" = "0.2"
